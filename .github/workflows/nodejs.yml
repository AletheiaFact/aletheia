# This workflow will do a clean install of node dependencies, build the source code and run tests across different versions of node
# For more information see: https://help.github.com/actions/language-and-framework-guides/using-nodejs-with-github-actions

name: Aletheia CI

on:
    push:
        # master and ufpb-labcheck run CI only to gate their deploys.
        branches: [stage, develop, master, ufpb-labcheck]
    pull_request:
        branches: [stage, develop]

# Superseded PR runs are cancelled; stage/develop pushes always finish.
concurrency:
    group: ci-${{ github.ref }}
    cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
    UMAMI_SITE_ID: ${{ secrets.DEVELOPMENT_UMAMI_SITE_ID }}
    ORY_SDK_URL: http://127.0.0.1:4433 #${{ secrets.DEVELOPMENT_ORY_SDK_URL }}
    # ORY_ACCESS_TOKEN: ${{ secrets.DEVELOPMENT_ORY_ACCESS_TOKEN }}
    ALETHEIA_SCHEMA_ID: ${{ secrets.DEVELOPMENT_ALETHEIA_SCHEMA_ID }}
    CI_ORY_USERID: ${{ secrets.CI_ORY_USERID }}
    CI_ORY_USER_PASSWORD: ${{ secrets.CI_ORY_USER_PASSWORD }}
    TEST_RECAPTCHA_SECRET: 6LeIxAcTAAAAAGG-vFI1TnRWxMZNFuojJ4WifJWe # public secret for CI tests provided by google
    TEST_RECAPTCHA_SITEKEY: 6LeIxAcTAAAAAJcZVRqyHh71UMIEGNQ_MXjiZKhI # public sitekey for CI tests provided by google
    NEXT_PUBLIC_RECAPTCHA_SITEKEY: 6LeIxAcTAAAAAJcZVRqyHh71UMIEGNQ_MXjiZKhI # public sitekey for CI tests provided by google
    AWS_SDK_BUCKET: ${{ secrets.DEVELOPMENT_AWS_SDK_BUCKET }}
    AWS_ACCESS_KEY_ID: ${{ secrets.DEVELOPMENT_AWS_ACCESS_KEY_ID }}
    AWS_SECRET_ACCESS_KEY: ${{ secrets.DEVELOPMENT_AWS_SECRET_ACCESS_KEY }}
    GITLAB_FEATURE_FLAG_URL: ${{ secrets.GITLAB_FEATURE_FLAG_URL }}
    GITLAB_FEATURE_FLAG_INSTANCE_ID: ${{ secrets.GITLAB_FEATURE_FLAG_INSTANCE_ID }}
    MONGOMS_VERSION: 6.0.17
    MONGOMS_DOWNLOAD_DIR: /home/runner/.cache/mongodb-binaries
jobs:
    test-docker:
        runs-on: ubuntu-24.04
        steps:
            - uses: actions/checkout@v7
            - uses: dorny/paths-filter@v4
              id: changes
              with:
                  filters: |
                      docker:
                          - Dockerfile
                          - .dockerignore
                          - package.json
                          - yarn.lock
                          - .yarnrc.yml
            # Only the install stage: `yarn build` is already covered by the build job.
            - uses: docker/setup-buildx-action@v3
              if: steps.changes.outputs.docker == 'true'
            - name: Test docker image dependency install before merge
              if: steps.changes.outputs.docker == 'true'
              uses: docker/build-push-action@v6
              with:
                  context: .
                  target: deps
                  push: false
                  cache-from: type=gha,scope=docker-deps
                  cache-to: type=gha,scope=docker-deps,mode=max

    build:
        runs-on: ubuntu-24.04
        steps:
            - uses: actions/checkout@v7
            - uses: ./.github/actions/setup-deps
            - run: yarn build
            # dist/.next is a hidden folder: without include-hidden-files the
            # artifact has no Next build, and every e2e job would rebuild the app.
            - uses: actions/upload-artifact@v7
              with:
                  name: aletheia-dist
                  include-hidden-files: true
                  retention-days: 3
                  path: |
                      dist/
                      !dist/.next/cache/

    test-lint:
        runs-on: ubuntu-24.04
        steps:
            - uses: actions/checkout@v7
              with:
                  fetch-depth: 0 # Sonar needs history for blame and new-code detection
            - name: Fail if .yarn/cache is committed
              run: |
                  if [ -n "$(git ls-files .yarn/cache)" ]; then
                    echo "::error::.yarn/cache must not be committed"; exit 1
                  fi
            - uses: ./.github/actions/setup-deps
            - run: yarn lint
            - run: yarn test:coverage
              env:
                  NODE_OPTIONS: "--max_old_space_size=4096"
                  CI_MONGODB_URI: mongodb://127.0.0.1:35025/Aletheia
            - name: SonarCloud Scan
              uses: SonarSource/sonarcloud-github-action@master
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }} # Needed to get PR information, if any
                  SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

    cypress-run:
        needs: build
        runs-on: ubuntu-24.04
        steps:
            - uses: actions/checkout@v7
            - uses: ./.github/actions/setup-deps
              with:
                  cypress-binary: "true"
            - uses: actions/download-artifact@v8
              with:
                  name: aletheia-dist
                  path: dist
            - run: |
                  echo '{"CI_ORY_USER_PASSWORD": "${{ env.CI_ORY_USER_PASSWORD }}"}' > ./cypress.env.json
            - name: Cypress run
              uses: cypress-io/github-action@v7
              with:
                  install: false
                  start: yarn test:e2e:cy
                  wait-on: "http://127.0.0.1:3000"
                  wait-on-timeout: 300
              env:
                  CI: true
                  CI_MONGODB_URI: mongodb://127.0.0.1:35025/Aletheia
            - uses: actions/upload-artifact@v7
              if: failure()
              with:
                  name: cypress-screenshots-mongo
                  path: cypress/screenshots
                  retention-days: 7

    cypress-run-component:
        runs-on: ubuntu-24.04
        steps:
            - uses: actions/checkout@v7
            - uses: ./.github/actions/setup-deps
              with:
                  cypress-binary: "true"
            - name: Run Cypress Component Tests
              run: yarn cypress run --component
              env:
                  CI: true

    vitest-postgres:
        runs-on: ubuntu-24.04
        steps:
            - uses: actions/checkout@v7
            - uses: ./.github/actions/setup-deps
            - name: Run unit tests with DB_TYPE=postgres (pglite)
              env:
                  DB_TYPE: postgres
                  # Canary: db-type-canary.spec.ts fails this job if the suite
                  # doesn't actually run under DB_TYPE=postgres (a green job
                  # must prove its skipIf-gated specs executed).
                  CI_EXPECT_DB_TYPE: postgres
                  NODE_OPTIONS: "--max_old_space_size=4096"
              run: yarn test:unit

    vitest-postgres-real:
        runs-on: ubuntu-24.04
        services:
            postgres:
                image: pgvector/pgvector:pg16
                env:
                    POSTGRES_USER: aletheia
                    POSTGRES_PASSWORD: aletheia
                    POSTGRES_DB: aletheia
                ports:
                    - 5432:5432
                options: >-
                    --health-cmd "pg_isready -U aletheia"
                    --health-interval 5s
                    --health-timeout 5s
                    --health-retries 10
        steps:
            - uses: actions/checkout@v7
            - uses: ./.github/actions/setup-deps
            - name: Apply the Drizzle migrations on a real Postgres
              env:
                  POSTGRES_URL: postgres://aletheia:aletheia@localhost:5432/aletheia
              run: yarn migrate:pg && yarn migrate:pg:status
            - name: Run the contract suites against the real Postgres
              env:
                  DB_TYPE: postgres
                  CI_EXPECT_DB_TYPE: postgres
                  TEST_POSTGRES_URL: postgres://aletheia:aletheia@localhost:5432/aletheia
                  NODE_OPTIONS: "--max_old_space_size=4096"
              run: yarn test:unit

    cypress-run-ferretdb:
        needs: build
        runs-on: ubuntu-24.04
        services:
            postgres:
                image: ghcr.io/ferretdb/postgres-documentdb:17-0.102.0-ferretdb-2.1.0
                env:
                    POSTGRES_USER: ferretdb
                    POSTGRES_PASSWORD: ferretdb
                    POSTGRES_DB: postgres
                ports:
                    - 5432:5432

            ferretdb:
                image: ghcr.io/ferretdb/ferretdb:2.1.0
                env:
                    FERRETDB_HANDLER: postgresql
                    FERRETDB_POSTGRESQL_URL: postgres://ferretdb:ferretdb@postgres:5432/postgres
                    # FERRETDB_AUTH: false
                ports:
                    - 27018:27017
        steps:
            - uses: actions/checkout@v7
            - uses: ./.github/actions/setup-deps
              with:
                  cypress-binary: "true"
            - uses: actions/download-artifact@v8
              with:
                  name: aletheia-dist
                  path: dist
            - run: |
                  echo '{"CI_ORY_USER_PASSWORD": "${{ env.CI_ORY_USER_PASSWORD }}"}' > ./cypress.env.json
            - name: Cypress run with FerretDB
              uses: cypress-io/github-action@v7
              with:
                  install: false
                  start: yarn test:e2e:cy-ferretdb
                  wait-on: "http://127.0.0.1:3000"
                  wait-on-timeout: 300
              env:
                  CI: true
                  CI_MONGODB_URI: "mongodb://ferretdb:ferretdb@127.0.0.1:27018/Aletheia"
            - uses: actions/upload-artifact@v7
              if: failure()
              with:
                  name: cypress-screenshots-ferretdb
                  path: cypress/screenshots
                  retention-days: 7

    # Deploys only after every check passed on a push to a deploy branch.
    # Called as a reusable workflow so it keeps the pushed ref, which the
    # environment branch policies check.
    deploy:
        if: github.event_name == 'push' && contains(fromJSON('["master", "stage", "ufpb-labcheck"]'), github.ref_name)
        needs:
            - test-docker
            - build
            - test-lint
            - cypress-run
            - cypress-run-component
            - vitest-postgres
            - vitest-postgres-real
            - cypress-run-ferretdb
        uses: ./.github/workflows/aws.yml
        secrets: inherit
