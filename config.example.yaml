services:
  - name: service-aletheia
    conf:
      app_affiliation: aletheia
      port: 3000
      cors: "*"
      debug: true
      websocketUrl: ws://localhost:5001
      baseUrl: "http://localhost:3000"
      automatedFactCheckingAPIUrl: AGENTS_API_URL
      hashSecretKey: HASH_SECRET_KEY
      #override_public_routes: true
      recaptcha_secret: RECAPTCHA_SECRET
      recaptcha_sitekey: 6Lc2BtYUAAAAAOUBI-9r1sDJUIfG2nt6C43noOXh
      # Captcha provider selection (recaptcha | none; custom providers add
      # their own value — see server/captcha/WRITING-A-PROVIDER.md). When
      # this whole `captcha` block is absent, the legacy recaptcha_secret /
      # recaptcha_sitekey keys above are used and the provider defaults to
      # "recaptcha" — existing deployments need no changes.
      # captcha:
      #   provider: recaptcha
      #   recaptcha:
      #     sitekey: 6Lc2BtYUAAAAAOUBI-9r1sDJUIfG2nt6C43noOXh
      #     secret: RECAPTCHA_SECRET
      db:
        connection_uri: mongodb://localhost/Aletheia
        type: mongodb
        options:
          retryWrites: true
          w: majority
      throttle:
        ttl: 60
        limit: 1000
      authentication_type: ory
      ory:
        url: ORY_SDK_URL
        # Use "admin" as the endpoint when running locally.
        # When using the cloud, the endpoint should be "api/kratos/admin".
        admin_endpoint:
        access_token: ORY_ACCESS_TOKEN
        schema_id: ALETHEIA_SCHEMA_ID
        hydra:
          url: ORY_SDK_URL
          # When using the cloud, the endpoint should be "admin".
          admin_endpoint:
      feature_flag:
        url: GITLAB_FEATURE_FLAG_URL
        appName: ENV
        instanceId: GITLAB_FEATURE_FLAG_INSTANCE_ID
      # example when using localstack
      aws:
        bucket: aletheia
        accessKeyId: test
        secretAccessKey: test
        # endpoint is only needed when using localstack
        endpoint: http://localhost:4566
      novu: # Notifications provider
        api_key: NOVU_API_KEY
      openai:
        api_key: OPENAI_API_KEY
      # LLM / embeddings provider (OpenAI-compatible). Point base_url at any
      # OpenAI-compatible server (Ollama, vLLM, LocalAI, Azure, ...) to self-host.
      llm:
        # api_key falls back to openai.api_key, then the OPENAI_API_KEY env var.
        api_key: OPENAI_API_KEY
        # base_url: http://localhost:11434/v1   # e.g. Ollama; leave empty for OpenAI
        chat_model: gpt-5-mini-2025-08-07
        temperature: 1
        # embeddings_model: leave UNSET to keep OpenAI's default model. Changing
        # it changes the vector space and breaks similarity vs. stored embeddings.
        # embeddings_model: text-embedding-3-small
      zenvia:
        api_url: ZENVIA_API_URL
        api_token: ZENVIA_API_TOKEN
      agencia:
        access_token: AGENCIA_ACCESS_TOKEN
