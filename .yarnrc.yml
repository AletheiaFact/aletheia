nodeLinker: node-modules

plugins:
  - path: .yarn/plugins/@yarnpkg/plugin-workspace-tools.cjs
    spec: "@yarnpkg/plugin-workspace-tools"

yarnPath: .yarn/releases/yarn-3.6.3.cjs

# YN0013 ("can't be found in the cache") prints one line per package on a
# cold cache, flooding CI and docker build logs. It is informational only.
logFilters:
  - code: YN0013
    level: discard
